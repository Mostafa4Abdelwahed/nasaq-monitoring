# ════════════════════════════════════════════════════════════════
#  nasaq-monitoring — قواعد تنبيه الحاويات وخدمات systemd
#  ملاحظة: systemd collector يُفعَّل في Node Exporter (install.sh)
# ════════════════════════════════════════════════════════════════
groups:
  - name: containers
    rules:
      # ───────── حاوية بتعمل restart باستمرار ─────────
      - alert: ContainerRestarting
        expr: changes(container_start_time_seconds{name!=""}[15m]) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container restarting repeatedly: {{ $labels.name }}"
          description: "Container {{ $labels.name }} restarted {{ printf \"%.0f\" $value }} times in the last 15 minutes — check the logs."
          dashboard_url: "http://localhost:3000/d/nasaq-containers"

      # ───────── استهلاك حاوية للذاكرة عالي ─────────
      - alert: ContainerHighMemory
        expr: sum by (name) (container_memory_working_set_bytes{name!="", image!=""}) > 800 * 1024 * 1024
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High container memory usage: {{ $labels.name }}"
          description: "Container {{ $labels.name }} is using {{ $value | humanize1024 }}B of memory."
          dashboard_url: "http://localhost:3000/d/nasaq-containers"

      # ───────── خدمة systemd فشلت ─────────
      - alert: SystemdServiceFailed
        expr: node_systemd_unit_state{job="node-exporter", state="failed"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "System unit failed: {{ $labels.name }}"
          description: "systemd service {{ $labels.name }} is in failed state — check: systemctl status {{ $labels.name }}"
          dashboard_url: "http://localhost:3000/d/nasaq-logs"
