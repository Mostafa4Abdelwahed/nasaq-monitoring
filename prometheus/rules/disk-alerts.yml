# ════════════════════════════════════════════════════════════════
#  nasaq-monitoring — قواعد تنبيه الأقراص والتخزين
# ════════════════════════════════════════════════════════════════
groups:
  - name: disk
    rules:
      # ───────── المساحة قربت تخلص ─────────
      - alert: DiskSpaceLow
        expr: 100 - (node_filesystem_avail_bytes{job="node-exporter", fstype!~"tmpfs|overlay|squashfs|ramfs"} / node_filesystem_size_bytes{job="node-exporter", fstype!~"tmpfs|overlay|squashfs|ramfs"} * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space ({{ $labels.mountpoint }})"
          description: "Disk {{ $labels.mountpoint }} is {{ printf \"%.1f\" $value }}% full."
          dashboard_url: "http://localhost:3000/d/nasaq-disk"

      # ───────── المساحة حرجة ─────────
      - alert: DiskSpaceCritical
        expr: 100 - (node_filesystem_avail_bytes{job="node-exporter", fstype!~"tmpfs|overlay|squashfs|ramfs"} / node_filesystem_size_bytes{job="node-exporter", fstype!~"tmpfs|overlay|squashfs|ramfs"} * 100) > 95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical disk space ({{ $labels.mountpoint }})"
          description: "Disk {{ $labels.mountpoint }} is {{ printf \"%.1f\" $value }}% full — services may stop."
          dashboard_url: "http://localhost:3000/d/nasaq-disk"

      # ───────── تنبؤ خطي: القرص هيمتلي خلال 24 ساعة ─────────
      - alert: DiskWillFillIn24h
        expr: predict_linear(node_filesystem_avail_bytes{job="node-exporter", fstype!~"tmpfs|overlay|squashfs|ramfs"}[6h], 24 * 3600) < 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Disk will fill within 24h ({{ $labels.mountpoint }})"
          description: "At the current usage rate, {{ $labels.mountpoint }} is expected to fill within 24 hours."
          dashboard_url: "http://localhost:3000/d/nasaq-disk"

      # ───────── inodes قربت تخلص ─────────
      - alert: DiskInodesLow
        expr: 100 * (node_filesystem_files_free{job="node-exporter", fstype!~"tmpfs|overlay|squashfs|ramfs"} / node_filesystem_files{job="node-exporter", fstype!~"tmpfs|overlay|squashfs|ramfs"}) < 15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low inodes ({{ $labels.mountpoint }})"
          description: "{{ printf \"%.1f\" $value }}% of inodes remain on {{ $labels.mountpoint }} — new file creation may fail."
          dashboard_url: "http://localhost:3000/d/nasaq-disk"

      # ───────── انشغال القرص العالي ─────────
      - alert: HighDiskIO
        expr: rate(node_disk_io_time_seconds_total{job="node-exporter"}[5m]) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High disk IO ({{ $labels.device }})"
          description: "Disk {{ $labels.device }} is {{ printf \"%.0f\" $value }}% busy — possible I/O slowness."
          dashboard_url: "http://localhost:3000/d/nasaq-disk"
