# ════════════════════════════════════════════════════════════════
#  nasaq-monitoring — قواعد تنبيه الخدمات والمواقع (Blackbox)
#  المقاييس مصدرها job = "blackbox-services"
# ════════════════════════════════════════════════════════════════
groups:
  - name: services
    rules:
      # ───────── خدمة/موقع واقع ─────────
      - alert: ServiceDown
        expr: probe_success{job="blackbox-services"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service down: {{ $labels.service }}"
          description: "Service {{ $labels.service }} ({{ $labels.instance }}) has not responded to probing for a minute."
          dashboard_url: "http://localhost:3000/d/nasaq-services"

      # ───────── استجابة بطيئة ─────────
      - alert: SlowResponse
        expr: probe_duration_seconds{job="blackbox-services"} > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow response: {{ $labels.service }}"
          description: "Response time of {{ $labels.service }} is {{ printf \"%.2f\" $value }}s (above the 2s limit)."
          dashboard_url: "http://localhost:3000/d/nasaq-services"

      # ───────── شهادة SSL قربت تنتهي ─────────
      - alert: SSLCertExpiringSoon
        expr: probe_ssl_earliest_cert_expiry{job="blackbox-services"} - time() < 14 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "SSL certificate expiring soon: {{ $labels.service }}"
          description: "{{ $value | humanizeDuration }} left until the certificate of {{ $labels.instance }} expires."
          dashboard_url: "http://localhost:3000/d/nasaq-services"

      # ───────── شهادة SSL منتهية ─────────
      - alert: SSLCertExpired
        expr: probe_ssl_earliest_cert_expiry{job="blackbox-services"} - time() < 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "SSL certificate expired: {{ $labels.service }}"
          description: "The certificate of {{ $labels.instance }} has expired — the site may appear insecure to visitors."
          dashboard_url: "http://localhost:3000/d/nasaq-services"
