# ════════════════════════════════════════════════════════════════
#  nasaq-monitoring — Prometheus config
#  المجمّعات مجمعة هنا + file_sd للخدمات (تتعدَّل من الداشبورد)
# ════════════════════════════════════════════════════════════════

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# قواعد التنبيه (تُضاف في Phase 4)
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # ───────── Prometheus نفسه ─────────
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # ───────── Alertmanager ─────────
  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093

  # ───────── Node Exporter (native على الهوست) ─────────
  - job_name: node-exporter
    static_configs:
      - targets:
          - host.docker.internal:9100
        labels:
          service: os-vps

  # ───────── مقاييس دوكر / الكونتينرات ─────────
  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  # ───────── خدمات ومواقع (قابلة للتعديل من الداشبورد) ─────────
  # ملفات targets/*.json — المسح يعيد اكتشاف الـ targets تلقائياً عند أي تغيير
  # (refresh_interval: 30s) — بدون إعادة تشغيل
  - job_name: blackbox-services
    metrics_path: /probe
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.json
        refresh_interval: 30s
    relabel_configs:
      # الـ target نفسه يبقى معامل probe
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      # نوع الفحص يحيا من label module في services.json
      # (http_2xx / http_2xx_ssl / tcp_connect / icmp)
      - source_labels: [module]
        target_label: __param_module
      # إرسال الفحص إلى الـ Blackbox Exporter نفسه
      - target_label: __address__
        replacement: blackbox-exporter:9115
